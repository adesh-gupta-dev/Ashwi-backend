<div style="font-family: Arial, Helvetica, sans-serif; background:#f6f7fb; padding:32px;">
  <div style="max-width:600px; margin:0 auto; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e5e7eb;">
    <div style="padding:24px 28px; background:linear-gradient(135deg,#0ea5e9,#22c55e); color:#ffffff;">
      <h1 style="margin:0; font-size:20px; font-weight:700;">Ashwi</h1>
      <p style="margin:6px 0 0; font-size:13px; opacity:0.9;">Secure your account</p>
    </div>
    <div style="padding:28px;">
      <h2 style="margin:0 0 12px; font-size:18px; color:#111827;">Verify your email</h2>
      <p style="margin:0 0 16px; color:#4b5563; font-size:14px; line-height:1.6;">
        Thanks for signing up. Please confirm your email address to activate your account.
      </p>
      <div style="margin:20px 0;">
        <a href="{{url}}" style="display:inline-block; padding:12px 18px; background:#111827; color:#ffffff; text-decoration:none; border-radius:10px; font-weight:600; font-size:14px;">
          Verify Email
        </a>
      </div>
      <p style="margin:0 0 10px; color:#6b7280; font-size:12px;">
        Or copy and paste this link into your browser:
      </p>
      <p style="margin:0; word-break:break-all; color:#2563eb; font-size:12px;">{{url}}</p>
    </div>
    <div style="padding:16px 28px; background:#f9fafb; color:#6b7280; font-size:12px;">
      If you didn’t request this, you can safely ignore this email.
    </div>
  </div>
</div>
